<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Aarish Korasikha's student profile and projects.">
    <title>Aarish Korasikha | Home</title>
    <style>
      :root { --ink: #263044; --muted: #68738a; --pink: #f7a8c4; --blue: #a7d8f5; --paper: #fffdf8; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: var(--ink); font-family: "Trebuchet MS", "Segoe UI", sans-serif; background: #fff8f1 radial-gradient(#f2d9d4 1px, transparent 1px); background-size: 22px 22px; }
      main { width: min(650px, 100%); padding: clamp(28px, 7vw, 56px); text-align: center; background: var(--paper); border: 2px solid var(--ink); border-radius: 28px 18px 30px 18px; box-shadow: 8px 8px 0 var(--pink); }
      .sticker { display: inline-block; padding: 5px 12px; border-radius: 999px; background: #ffe28a; font-weight: 800; transform: rotate(-2deg); }
      h1 { margin: 20px 0 10px; font-size: clamp(2.3rem, 8vw, 4rem); line-height: 1.05; letter-spacing: -.05em; }
      p { max-width: 480px; margin: 0 auto 24px; color: var(--muted); line-height: 1.7; }
      a { display: inline-block; padding: 11px 18px; color: var(--ink); background: var(--blue); border: 2px solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); font-weight: 800; text-decoration: none; }
      a:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
      a:focus-visible { outline: 3px solid #57418e; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <span class="sticker">a student’s corner of the internet ✿</span>
      <h1>Hey, I'm Aarish!</h1>
      <p>I'm a high school student who likes learning, creating, and exploring new ideas. This is my little home page on the web.</p>
      <a href="profile.html">Come see my profile →</a>
    </main>
  </body>
</html>
