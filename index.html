<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Aarish Korasikha's student profile and interests.">
    <title>Aarish Korasikha | Home</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-1: #090b1a;
        --bg-2: #10162a;
        --bg-3: #160d2d;
        --panel: rgba(16, 24, 42, 0.8);
        --line: rgba(126, 249, 255, 0.42);
        --text: #edf7ff;
        --muted: #b5c4dc;
        --cyan: #7ef9ff;
        --pink: #ff5ec9;
        --violet: #9d7dff;
        --lime: #bafc7a;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--text);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 15% 20%, rgba(126, 249, 255, 0.20), transparent 18%),
          radial-gradient(circle at 80% 10%, rgba(255, 94, 201, 0.18), transparent 22%),
          radial-gradient(circle at 50% 100%, rgba(157, 125, 255, 0.14), transparent 26%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2) 40%, var(--bg-3));
        position: relative;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
        background-size: 22px 22px;
        pointer-events: none;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
          180deg,
          rgba(255,255,255,0.04),
          rgba(255,255,255,0.04) 1px,
          transparent 2px,
          transparent 4px
        );
        opacity: 0.18;
        pointer-events: none;
      }

      main {
        position: relative;
        width: min(700px, 100%);
        padding: clamp(28px, 7vw, 56px);
        text-align: center;
        background: linear-gradient(180deg, rgba(16, 22, 42, 0.9), rgba(18, 22, 38, 0.84));
        border: 2px solid var(--line);
        border-radius: 24px 16px 24px 16px;
        box-shadow: 0 0 0 2px rgba(255,255,255,0.04), 0 20px 48px rgba(12, 20, 42, 0.8), 0 0 28px rgba(126, 249, 255, 0.16);
        backdrop-filter: blur(10px);
      }

      main::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 0%, rgba(126, 249, 255, 0.18), transparent 38%);
        pointer-events: none;
      }

      .sticker {
        position: relative;
        display: inline-block;
        padding: 7px 14px;
        border-radius: 10px;
        border: 2px solid rgba(126, 249, 255, 0.8);
        background: rgba(126, 249, 255, 0.08);
        box-shadow: inset 0 0 12px rgba(126,249,255,0.12), 0 0 18px rgba(126,249,255,0.16);
        color: var(--cyan);
        font-weight: 900;
        letter-spacing: .12em;
        text-transform: uppercase;
        font-size: .75rem;
      }

      h1 {
        position: relative;
        margin: 20px 0 12px;
        font-size: clamp(2.4rem, 8vw, 4.5rem);
        line-height: 1.04;
        letter-spacing: -.06em;
      }

      h1 span {
        background: linear-gradient(90deg, var(--cyan), var(--pink), var(--violet));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 16px rgba(126, 249, 255, 0.18);
      }

      p {
        position: relative;
        max-width: 540px;
        margin: 0 auto 24px;
        color: var(--muted);
        line-height: 1.7;
        font-size: 1.08rem;
      }

      a {
        position: relative;
        display: inline-block;
        padding: 12px 18px;
        color: var(--text);
        background: linear-gradient(135deg, rgba(126,249,255,0.16), rgba(157,125,255,0.18));
        border: 2px solid rgba(126, 249, 255, 0.8);
        border-radius: 12px;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 0 18px rgba(126,249,255,0.14);
        font-weight: 800;
        text-decoration: none;
        transition: transform .2s ease, box-shadow .2s ease;
      }

      a:hover {
        transform: translate(-2px, -2px);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 0 24px rgba(126,249,255,0.2);
      }

      a:focus-visible {
        outline: 3px solid var(--cyan);
        outline-offset: 4px;
      }

      @media (max-width: 520px) {
        body { padding: 18px; }
        .sticker { letter-spacing: .08em; }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="sticker">7th grader • athlete • builder</span>
      <h1>Hey, I'm <span>Aarish!</span></h1>
      <p>I'm a 7th grader who loves soccer, chess, robotics, design, space, and engineering. I build robots, explore new ideas, and enjoy creating things with code.</p>
      <a href="profile.html">View my profile →</a>
    </main>
  </body>
</html>
