<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Aarish Korasikha's student profile and interests.">
    <title>Aarish Korasikha | Home</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-1: #070b17;
        --bg-2: #0e1630;
        --bg-3: #170d2a;
        --panel: rgba(13, 19, 34, 0.75);
        --line: rgba(148, 163, 184, 0.28);
        --text: #edf6ff;
        --muted: #bfd0ea;
        --cyan: #67e8f9;
        --pink: #f472b6;
        --violet: #a78bfa;
        --lime: #bdff9c;
        --amber: #fbbf24;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--text);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 20% 20%, rgba(103, 232, 249, 0.18), transparent 22%),
          radial-gradient(circle at 80% 10%, rgba(244, 114, 182, 0.14), transparent 26%),
          radial-gradient(circle at 50% 80%, rgba(167, 139, 250, 0.14), transparent 20%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2) 40%, var(--bg-3));
        position: relative;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
        background-size: 26px 26px;
        pointer-events: none;
        mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
      }

      main {
        position: relative;
        width: min(700px, 100%);
        padding: clamp(28px, 7vw, 56px);
        text-align: center;
        background: linear-gradient(180deg, rgba(11, 18, 30, 0.86), rgba(17, 25, 45, 0.82));
        border: 1px solid var(--line);
        border-radius: 28px 18px 30px 18px;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 24px 80px rgba(15, 23, 42, 0.7), 0 0 34px rgba(103, 232, 249, 0.18);
        backdrop-filter: blur(10px);
      }

      main::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 0%, rgba(103, 232, 249, 0.16), transparent 38%);
        pointer-events: none;
      }

      .sticker {
        position: relative;
        display: inline-block;
        padding: 6px 14px;
        border-radius: 999px;
        background: linear-gradient(135deg, rgba(103,232,249,0.18), rgba(167,139,250,0.18));
        border: 1px solid rgba(103, 232, 249, 0.5);
        color: var(--cyan);
        font-weight: 800;
        letter-spacing: .08em;
        text-transform: uppercase;
        box-shadow: 0 0 18px rgba(103, 232, 249, 0.18);
      }

      h1 {
        position: relative;
        margin: 20px 0 12px;
        font-size: clamp(2.3rem, 8vw, 4.4rem);
        line-height: 1.05;
        letter-spacing: -.06em;
      }

      h1 span {
        background: linear-gradient(90deg, var(--cyan), var(--pink), var(--violet));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 18px rgba(103, 232, 249, 0.18);
      }

      p {
        position: relative;
        max-width: 540px;
        margin: 0 auto 24px;
        color: var(--muted);
        line-height: 1.7;
        font-size: 1.08rem;
      }

      a {
        position: relative;
        display: inline-block;
        padding: 12px 18px;
        color: var(--text);
        background: linear-gradient(135deg, rgba(103,232,249,0.2), rgba(167,139,250,0.22));
        border: 1px solid rgba(103, 232, 249, 0.7);
        border-radius: 12px;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 14px 30px rgba(103, 232, 249, 0.17);
        font-weight: 800;
        text-decoration: none;
        transition: transform .2s ease, box-shadow .2s ease;
      }

      a:hover {
        transform: translate(-2px, -2px);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 18px 32px rgba(103, 232, 249, 0.22);
      }

      a:focus-visible {
        outline: 3px solid var(--cyan);
        outline-offset: 4px;
      }

      @media (max-width: 520px) {
        body { padding: 18px; }
        .sticker { letter-spacing: .05em; }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="sticker">7th grader • athlete • builder</span>
      <h1>Hey, I'm <span>Aarish!</span></h1>
      <p>I'm a 7th grader who loves soccer, chess, robotics, design, space, and engineering. I build robots, explore new ideas, and enjoy creating things with code.</p>
      <a href="profile.html">View my profile →</a>
    </main>
  </body>
</html>
